# Publicatie: de app (app3) op / uit dist/. Werkt zowel met Git-builds (Netlify draait dan npm run build) als met het
# uploaden van een zip van dist/.
# Omleidingen en headers staan NIET hier maar in dist/_redirects en dist/_headers, gemaakt door scripts/build-app3.mjs:
# bij een zip-upload komt dit bestand niet mee, die twee wel (audit 15 nov 2026, P2-01).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright is alleen voor de tests; de browser hoeft op Netlify niet mee.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

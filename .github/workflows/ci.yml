name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: QA suite (pure-logic + Playwright smoke + service worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Downloadt Playwright's eigen, door Playwright beheerde Chromium-build (in
      # ~/.cache/ms-playwright) plus de systeembibliotheken die een headless Chromium op een
      # kale Ubuntu-runner nodig heeft. De schermtests van app3 vallen op deze browser terug
      # zodra het vaste sandbox-pad (/opt/pw-browsers/chromium) niet bestaat.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # De tests van de oude app (tests/*.test.mjs op brewconsole_v2_2.html, `npm run qa`) horen
      # niet meer bij de poort: die app wordt niet meer uitgeleverd (op /oud/ staat alleen een
      # melding). Ze blijven met de hand te draaien. Keuze Jelle, audit 10 nov 2026 (P2-05).
      # De jobnaam hierboven blijft gelijk, zodat een vereiste check op GitHub blijft kloppen.

      # Engine 3: typecheck (TypeScript strict), eigen tests en een proefbouw met esbuild.
      - name: Engine 3 checks
        run: npm run e3:check

      # Nieuwe frontend (app3): typecheck, kerntests en schermtests in Chromium.
      - name: App3 checks
        run: npm run app3:check
